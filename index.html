<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>サッカープール 5vs5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--A:#3d8bfd;--B:#ff5a5a;--ol:#1c2b22;--cream:#fff8e7;--yel:#ffd43b;--grn:#5cd15a;--ink:#1c2b22;--mut:#6b7a6f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#245c39;color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
.dg{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400}
#app{display:flex;flex-direction:column;height:100vh;background-color:#245c39;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.5px);background-size:22px 22px}
@supports(height:100dvh){#app{height:100dvh}}

/* ---- HUD ---- */
#hud{height:66px;display:flex;align-items:center;gap:8px;padding:0 10px;flex:none}
.iconbtn{width:42px;height:42px;border-radius:12px;border:3px solid var(--ol);background:var(--cream);display:grid;place-items:center;box-shadow:3px 3px 0 var(--ol)}
.iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ol)}
.iconbtn svg{width:20px;height:20px}
.board{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;background:var(--cream);border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol);overflow:hidden}
.team{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.06em;width:64px}
.team.A{justify-content:flex-end}.team.B{justify-content:flex-start}
.badge{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ol)}
.team.A .badge{background:var(--A)}.team.B .badge{background:var(--B)}
.scores{display:flex;align-items:center;gap:6px;font-size:26px;line-height:1;min-width:70px;justify-content:center}
.scores .sep{opacity:.35;font-size:18px}
.scores span.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.7) rotate(-8deg)}100%{transform:scale(1)}}
.turnbar{position:absolute;bottom:0;height:5px;width:50%;transition:left .35s cubic-bezier(.5,0,.2,1),background .35s;opacity:0;border-top:2px solid var(--ol)}
.turnbar.A{left:0;background:var(--A);opacity:1}
.turnbar.B{left:50%;background:var(--B);opacity:1}

#spinBar{display:none;flex:none;align-items:center;gap:8px;margin:0 10px calc(8px + env(safe-area-inset-bottom));padding:6px 10px;border-radius:14px;background:var(--cream);border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol)}
#spinBar.dis{opacity:.45;pointer-events:none}
#spinBar .sl{font-size:13px}
#spinBar .sd{font-weight:800;font-size:16px}
.srange{flex:1;position:relative;height:30px;display:flex;align-items:center}
.smid{position:absolute;left:50%;top:5px;bottom:5px;width:3px;margin-left:-1.5px;background:var(--ol);border-radius:2px;pointer-events:none}
#spinR{-webkit-appearance:none;appearance:none;width:100%;height:12px;margin:0;border-radius:99px;border:2.5px solid var(--ol);background:linear-gradient(90deg,#9cc7ff,#fff 50%,#ffd43b);outline:none;position:relative}
#spinR::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ol);box-shadow:2px 2px 0 var(--ol);cursor:pointer}
#spinR::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ol);box-shadow:2px 2px 0 var(--ol)}
#spinBar.act #spinR::-webkit-slider-thumb{background:var(--yel)}
#spinBar.act #spinR::-moz-range-thumb{background:var(--yel)}
.s0{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--ol);background:#fff;font:800 13px "M PLUS Rounded 1c",sans-serif;color:var(--ink);flex:none}
#spinBar .sv{font-size:11px;font-weight:800;width:50px;white-space:nowrap;text-align:center;color:var(--mut)}
#stage{touch-action:none;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
canvas{touch-action:none;display:block}
#turn{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;padding:4px 14px;border-radius:99px;background:var(--cream);color:var(--ink);border:3px solid var(--ol);box-shadow:2px 2px 0 var(--ol);pointer-events:none;z-index:2;white-space:nowrap}

/* ---- overlays ---- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;padding:20px;background:rgba(18,40,26,.55)}
.overlay.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--cream);border:3px solid var(--ol);border-radius:22px;padding:22px 20px;width:100%;max-width:360px;text-align:center;box-shadow:6px 6px 0 var(--ol);animation:rise .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(20px) scale(.92) rotate(-1deg);opacity:0}to{transform:none;opacity:1}}
#menu{background-color:#3a9a55;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 44px,transparent 44px 88px);background-size:cover;background-position:center}
.logo{margin:-2px 0 4px}
.logo svg{width:66px;height:66px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(20deg)}}
#logoImg{display:none;max-width:100%;max-height:150px;margin:-6px auto 0;filter:drop-shadow(3px 4px 0 rgba(28,43,34,.25))}
h1{font-size:38px;line-height:1.02;letter-spacing:.02em;color:var(--yel);-webkit-text-stroke:2.5px var(--ol);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ol)}
.tag{display:inline-block;margin:10px 0 12px;font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--cream);background:var(--ol);padding:4px 12px;border-radius:99px}
h2{font-size:28px;margin-bottom:10px;color:var(--yel);-webkit-text-stroke:2px var(--ol);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ol)}
.label{font-size:11px;color:var(--mut);text-align:left;margin:12px 2px 6px;font-weight:800;letter-spacing:.12em}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border-radius:12px;border:3px solid var(--ol);background:#fff;color:var(--ink);font-weight:800;font-size:14px;font-family:inherit;box-shadow:2px 2px 0 var(--ol);transition:transform .08s}
.seg button.on{background:var(--yel);transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ol)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:3px solid var(--ol);font-size:16px;font-weight:800;font-family:inherit;margin-top:12px;color:var(--ink);background:var(--grn);box-shadow:4px 4px 0 var(--ol);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ol)}
.btn.ghost{background:#fff}
.howto{margin-top:14px;text-align:left;font-size:12px;line-height:1.7;color:var(--mut);background:#fff;border:2px dashed #c9c1aa;border-radius:12px;padding:8px 10px}
.howto b{color:var(--ink)}

/* ---- formation panel ---- */
#formPanel{display:none;flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--cream);border-top:3px solid var(--ol)}
#formPanel.show{display:block;animation:fade .25s}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:8px;border-radius:12px;border:3px solid var(--ol);background:#fff;color:var(--ink);font-weight:800;font-size:13px;font-family:inherit;display:flex;gap:6px;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ol)}
.tabs .dotc{width:12px;height:12px;border-radius:50%;border:2px solid var(--ol)}
.tabs button.on{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ol);color:#fff;text-shadow:1px 1px 0 var(--ol)}
.tabs button.on.A{background:var(--A)}.tabs button.on.B{background:var(--B)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 12px;border-radius:99px;border:2.5px solid var(--ol);background:#fff;color:var(--ink);font-weight:800;font-size:13px;font-family:inherit}
.chips button.on{background:var(--yel)}
.hint{font-size:11px;color:var(--mut);margin:0 2px 8px}
.row{display:flex;gap:8px}.row .btn{margin-top:0;padding:12px}
.row .btn.ghost{flex:0 0 34%}

/* ---- online ---- */
.onrow{display:flex;gap:8px;align-items:stretch}
.onrow .btn{margin-top:0;flex:0 0 32%}
.inp{flex:1;min-width:0;padding:12px;border-radius:14px;border:3px solid var(--ol);font:800 18px "M PLUS Rounded 1c",sans-serif;letter-spacing:.2em;text-align:center;text-transform:lowercase;background:#fff;color:var(--ink);box-shadow:inset 2px 2px 0 rgba(0,0,0,.08)}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 12px}
.codebox b{font-size:34px;letter-spacing:.18em;background:#fff;border:3px solid var(--ol);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ol)}
.copy{padding:8px 10px;border-radius:10px;border:2.5px solid var(--ol);background:var(--yel);font:800 12px inherit;font-family:inherit;box-shadow:2px 2px 0 var(--ol)}
.plist{display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:4px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:2.5px solid var(--ol);background:#fff;font-weight:800;font-size:14px}
.pl .badge{flex:none}.pl .st{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:99px;border:2px solid var(--ol);background:#eee}
.pl .st.ok{background:var(--grn)}.pl.wait{opacity:.55;border-style:dashed}
.sub{font-size:12px;color:var(--mut);margin:-4px 0 12px;line-height:1.6}
.err{color:#c62828}
/* ---- banners ---- */
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;z-index:5;display:none}
#banner.show{display:block}
#banner .big{font-size:80px;line-height:1;letter-spacing:.03em;color:var(--yel);-webkit-text-stroke:5px var(--ol);paint-order:stroke fill;text-shadow:7px 7px 0 var(--tc);animation:goal 1.5s cubic-bezier(.2,1.5,.4,1) both}
#banner .small{display:inline-block;margin-top:10px;font-size:14px;font-weight:800;letter-spacing:.2em;color:var(--ink);background:var(--cream);border:3px solid var(--ol);border-radius:99px;padding:4px 14px;box-shadow:3px 3px 0 var(--ol);animation:fade .4s .2s both}
@keyframes goal{0%{transform:scale(.2) rotate(-14deg);opacity:0}25%{transform:scale(1.2) rotate(4deg);opacity:1}40%{transform:scale(1) rotate(-2deg)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#turnPop{position:fixed;left:0;right:0;top:45%;text-align:center;pointer-events:none;z-index:4;font-size:32px;letter-spacing:.06em;opacity:0;color:#fff;-webkit-text-stroke:3px var(--ol);paint-order:stroke fill;text-shadow:4px 4px 0 var(--tc)}
#turnPop.show{animation:tp .9s ease both}
@keyframes tp{0%{opacity:0;transform:translateX(-40px) skewX(-10deg)}20%{opacity:1;transform:none}75%{opacity:1;transform:none}100%{opacity:0;transform:translateX(40px) skewX(10deg)}}
.rscore{font-size:54px;margin:2px 0 4px;letter-spacing:.06em;-webkit-text-stroke:2.5px var(--ol);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ol)}
.rscore .a{color:var(--A)}.rscore .b{color:var(--B)}
.trophy{font-size:46px;animation:rise .5s}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <button class="iconbtn" id="menuBtn" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="none" stroke="#1c2b22" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    <div class="board">
      <div class="team A"><span id="nA">YOU</span><span class="badge"></span></div>
      <div class="scores dg"><span id="sA">0</span><span class="sep">:</span><span id="sB">0</span></div>
      <div class="team B"><span class="badge"></span><span id="nB">CPU</span></div>
      <div class="turnbar" id="turnbar"></div>
    </div>
    <button class="iconbtn" id="sndBtn" aria-label="サウンド"></button>
  </header>
  <div id="stage"><div id="turn">—</div><canvas id="cv"></canvas></div>
  <div id="spinBar">
    <span class="sl dg">SPIN</span>
    <span class="sd">↶</span>
    <div class="srange"><div class="smid"></div><input type="range" id="spinR" min="-100" max="100" step="1" value="0" aria-label="スピンの強さ（左がマイナス、右がプラス）"></div>
    <span class="sd">↷</span>
    <button class="s0" id="spin0" aria-label="スピンを0に戻す">0</button>
    <span class="sv" id="spinTxt">なし</span>
  </div>
  <div id="formPanel">
    <div class="tabs"><button class="A on" data-t="A"><span class="dotc" style="background:var(--A)"></span><span>青チーム</span></button><button class="B" data-t="B"><span class="dotc" style="background:var(--B)"></span><span>赤チーム</span></button></div>
    <div class="chips" id="chips"></div>
    <div class="hint">駒をドラッグして自陣内で自由に配置（センターサークル内は不可）</div>
    <div class="row"><button class="btn ghost" id="fBack">← 戻る</button><button class="btn" id="fStart">KICK OFF ▶</button></div>
  </div>
</div>

<div class="overlay show" id="menu"><div class="card">
  <img id="logoImg" alt=""><div class="logo" id="logoBall"><svg viewBox="0 0 64 64"><defs><radialGradient id="bg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#eef2f7"/><stop offset="1" stop-color="#9aa4b1"/></radialGradient></defs><circle cx="32" cy="32" r="29" fill="#fff" stroke="#1c2b22" stroke-width="4"/><path d="M32 20l11 8-4 13H25l-4-13z" fill="#1c2b22"/><path d="M32 2v10M58 22l-9 5M50 56l-6-8M14 56l6-8M6 22l9 5" stroke="#1c2b22" stroke-width="4" stroke-linecap="round"/></svg></div>
  <h1 class="dg" id="logoText">SOCCER<br>POOL</h1>
  <div class="tag">5 VS 5 · FLICK FOOTBALL</div>
  <div class="label">MODE</div>
  <div class="seg" id="modeSeg"><button data-v="cpu" class="on">CPU対戦</button><button data-v="pvp">2人対戦</button><button data-v="online">オンライン</button></div>
  <div id="diffWrap"><div class="label">CPU LEVEL</div>
  <div class="seg" id="diffSeg"><button data-v="easy">弱い</button><button data-v="normal" class="on">普通</button><button data-v="hard">強い</button></div></div>
  <button class="btn" id="toForm">フォーメーション設定へ ▶</button>
  <div class="howto"><b>遊び方</b>：自分の駒を後ろに引っ張って離すと反対方向へ。引く距離＝パワー。全駒が止まると相手の番。<b>先に3点</b>で勝利。</div>
</div></div>

<div class="overlay" id="online"><div class="card">
  <h2 class="dg">ONLINE</h2>
  <div id="onEntry">
    <div class="sub" id="onMsg">友だちと部屋コードで対戦できます</div>
    <button class="btn" id="onCreate">部屋を作る</button>
    <div class="label">部屋コードで参加</div>
    <div class="onrow"><input class="inp" id="onCode" maxlength="6" inputmode="latin" autocomplete="off" placeholder="abcd"><button class="btn" id="onJoin">参加</button></div>
    <button class="btn ghost" id="onRejoin" style="display:none"></button>
    <button class="btn ghost" id="onBack">← 戻る</button>
  </div>
  <div id="onLobby" style="display:none">
    <div class="label" style="margin-top:0">部屋コード</div>
    <div class="codebox"><b class="dg" id="onCodeShow">----</b><button class="copy" id="onCopy">コピー</button></div>
    <div class="plist" id="onPlayers"></div>
    <div class="sub" id="onLobbyMsg" style="margin:6px 0 0"></div>
    <button class="btn ghost" id="onForm">フォーメーション設定</button>
    <button class="btn" id="onReady">準備OK</button>
    <button class="btn ghost" id="onLeave">部屋を出る</button>
  </div>
</div></div>

<div class="overlay" id="pause"><div class="card">
  <h2 class="dg">PAUSE</h2>
  <button class="btn" id="pResume">再開</button>
  <button class="btn ghost" id="pForm">フォーメーション変更（試合リセット）</button>
  <button class="btn ghost" id="pMenu">メニューへ</button>
</div></div>

<div class="overlay" id="result" style="background:rgba(3,10,6,.5)"><div class="card">
  <div class="trophy" id="rIcon">🏆</div>
  <h2 class="dg" id="rTitle">YOU WIN!</h2>
  <div class="rscore dg" id="rScore"></div>
  <button class="btn" id="rAgain">もう一度</button>
  <button class="btn ghost" id="rForm">フォーメーションを変える</button>
  <button class="btn ghost" id="rMenu">メニューへ</button>
</div></div>

<div id="banner"><div class="big dg">GOAL!</div><div class="small" id="bSub"></div></div>
<div id="turnPop" class="dg"></div>

<script>
(()=>{
// ===== 定数 =====
const W=360,H=600,M=36,SM=16;
const R=18,BR=11,GW=110,GX1=(W-GW)/2,GX2=GX1+GW,GD=28,POST=4;
const CENTER_R=50;
const MAX_SPEED=17,MAX_DRAG=130,PCURVE=1.25;   // 弾きの強さ（最大速度・引き距離・パワー曲線）
const FR_P=0.972,FR_B=0.98,STOP=0.06,REST_WALL=0.72,REST_BODY=0.9;
const M_P=1,M_B=0.55,SUB=4,WIN=3;
const CURVE=0.035,SPIN_DECAY=0.97,SPIN_XFER=0.45;   // スピン：1ステップの曲がり角の係数・減衰率・衝突で相手へ移る割合
const COL={A:'#3d8bfd',B:'#ff5a5a'},SHADE={A:'#2563c9',B:'#c93636'},LIGHT={A:'#9cc7ff',B:'#ffb3b3'};
const speedOf=pw=>MAX_SPEED*Math.pow(pw,PCURVE);

const PRESETS={
  '2-2':[[.5,.95],[.3,.82],[.7,.82],[.3,.64],[.7,.64]],
  '1-2-1':[[.5,.95],[.5,.84],[.22,.72],[.78,.72],[.5,.62]],
  '3-1':[[.5,.95],[.2,.8],[.5,.82],[.8,.8],[.5,.63]],
  '1-3':[[.5,.95],[.5,.84],[.2,.65],[.5,.62],[.8,.65]],
  '2-1-1':[[.5,.95],[.3,.84],[.7,.84],[.5,.73],[.5,.62]],
  '4-0':[[.5,.95],[.15,.8],[.38,.84],[.62,.84],[.85,.8]],
};
const $=id=>document.getElementById(id);

// ===== 状態 =====
const S={mode:'cpu',diff:'normal',forms:{A:null,B:null},preset:{A:'2-2',B:'1-2-1'},
  editTeam:'A',screen:'menu',bodies:[],score:{A:0,B:0},turn:'A',phase:'idle',
  aim:null,drag:null,steps:0,cpuAim:null,paused:false,gen:0,shake:0,trail:[],ripple:null};
const P=[]; // particles

function loadForms(){
  try{const d=JSON.parse(localStorage.getItem('soccerpool5')||'null');
    if(d&&d.forms&&d.forms.A&&d.forms.B){S.forms=d.forms;S.preset=d.preset}}catch(e){}
  for(const t of ['A','B'])if(!S.forms[t])S.forms[t]=PRESETS[S.preset[t]].map(p=>p.slice());
}
function saveForms(){try{localStorage.setItem('soccerpool5',JSON.stringify({forms:S.forms,preset:S.preset}))}catch(e){}}
const toWorld=(t,f)=>t==='A'?{x:f[0]*W,y:f[1]*H}:{x:(1-f[0])*W,y:(1-f[1])*H};
const toNorm=(t,p)=>t==='A'?[p.x/W,p.y/H]:[1-p.x/W,1-p.y/H];

// ===== 物理 =====
function makeBodies(){
  const bs=[{x:W/2,y:H/2,vx:0,vy:0,r:BR,m:M_B,ball:true,team:null,n:0,rot:0,spin:0}];
  const FM=(S.mode==='online'&&S.screen!=='form'&&O.forms)?O.forms:S.forms;
  for(const t of ['A','B'])FM[t].forEach((f,i)=>{const p=toWorld(t,f);
    bs.push({x:p.x,y:p.y,vx:0,vy:0,r:R,m:M_P,ball:false,team:t,n:i+1,spin:0});});
  return bs;
}
function collide(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
  if(d2>=rr*rr||d2===0)return 0;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=rr-d,tm=a.m+b.m;
  a.x-=nx*ov*b.m/tm;a.y-=ny*ov*b.m/tm;b.x+=nx*ov*a.m/tm;b.y+=ny*ov*a.m/tm;
  const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rv<0){const j=-(1+REST_BODY)*rv/(1/a.m+1/b.m);
    a.vx-=j*nx/a.m;a.vy-=j*ny/a.m;b.vx+=j*nx/b.m;b.vy+=j*ny/b.m;
    const ds=(a.spin-b.spin)*SPIN_XFER;if(ds){a.spin-=ds;b.spin+=ds}   // 回転の受け渡し
    return j}
  return 0.0001;
}
function post(b,px,py){
  const dx=b.x-px,dy=b.y-py,rr=b.r+POST,d2=dx*dx+dy*dy;
  if(d2>=rr*rr||d2===0)return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
  b.x=px+nx*rr;b.y=py+ny*rr;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+REST_WALL)*vn*nx;b.vy-=(1+REST_WALL)*vn*ny;b._p=Math.max(b._p||0,-vn)}
}
// 壁で跳ね返ったとき、その速さを b._w に記録（効果音用）
function bx_(b,v){b._w=Math.max(b._w||0,Math.abs(v));b.spin*=0.5}
function walls(b){
  if(b.x<b.r){b.x=b.r;bx_(b,b.vx);b.vx=Math.abs(b.vx)*REST_WALL}
  if(b.x>W-b.r){b.x=W-b.r;bx_(b,b.vx);b.vx=-Math.abs(b.vx)*REST_WALL}
  const inGoal=b.y<0||b.y>H;
  const mouth=b.ball&&((b.x>GX1&&b.x<GX2)||inGoal);
  if(!mouth){
    if(b.y<b.r){b.y=b.r;bx_(b,b.vy);b.vy=Math.abs(b.vy)*REST_WALL}
    if(b.y>H-b.r){b.y=H-b.r;bx_(b,b.vy);b.vy=-Math.abs(b.vy)*REST_WALL}
  }else if(inGoal){
    if(b.x<GX1+b.r){b.x=GX1+b.r;bx_(b,b.vx);b.vx=Math.abs(b.vx)*REST_WALL}
    if(b.x>GX2-b.r){b.x=GX2-b.r;bx_(b,b.vx);b.vx=-Math.abs(b.vx)*REST_WALL}
  }
  post(b,GX1,0);post(b,GX2,0);post(b,GX1,H);post(b,GX2,H);

// fx: 実試合のみ渡す衝突エフェクト用コールバック
function step(bs,fx){
  const n=bs.length;
  for(let s=0;s<SUB;s++){
    for(const b of bs){b.x+=b.vx/SUB;b.y+=b.vy/SUB}
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const k=collide(bs[i],bs[j]);if(fx&&k>1.2)fx(bs[i],bs[j],k)}
    for(const b of bs)walls(b);
    const ball=bs[0];
    if(ball.y<-ball.r)return 'A';
    if(ball.y>H+ball.r)return 'B';
  }
  for(const b of bs){const f=b.ball?FR_B:FR_P;b.vx*=f;b.vy*=f;
    curve(b);
    if(b.vx*b.vx+b.vy*b.vy<STOP*STOP){b.vx=0;b.vy=0;b.spin=0}}
  return null;
}
// スピンによる曲がり（マグヌス効果風）。速度ベクトルを少しだけ回転させる。
// 三角関数を使わず四則演算と平方根だけで計算するので、どの端末でも同じ結果になる（オンライン同期のため）。
function curve(b){
  if(!b.spin)return;
  const v2=b.vx*b.vx+b.vy*b.vy;
  if(v2===0){b.spin=0;return}
  const sp=Math.sqrt(v2),th=CURVE*b.spin*Math.min(1,sp/4);
  const nx=b.vx-th*b.vy,ny=b.vy+th*b.vx,k=sp/Math.sqrt(nx*nx+ny*ny);
  b.vx=nx*k;b.vy=ny*k;
  b.spin*=SPIN_DECAY;if(Math.abs(b.spin)<0.01)b.spin=0;
}
const stopped=bs=>bs.every(b=>b.vx===0&&b.vy===0);

// ===== CPU =====
const AI={easy:{pieces:2,rand:5,powers:[.6,1],noise:.14,ghost:1,spins:[0]},
  normal:{pieces:5,rand:10,powers:[.55,.8,1],noise:.07,ghost:3,spins:[0]},
  hard:{pieces:5,rand:10,powers:[.55,.8,1],noise:.03,ghost:5,spins:[0,-1,1]}};
function evaluate(bs,goal,team,bx0,by0){
  if(goal===team)return 1e5;
  if(goal)return -1e5;
  const ball=bs[0];
  const prog=team==='A'?(H-ball.y)/H:ball.y/H;
  let s=prog*100;
  if(Math.hypot(ball.x-bx0,ball.y-by0)<3)s-=40;
  let dM=1e9,dO=1e9;
  for(let i=1;i<bs.length;i++){const d=Math.hypot(bs[i].x-ball.x,bs[i].y-ball.y);
    if(bs[i].team===team)dM=Math.min(dM,d);else dO=Math.min(dO,d)}
  if(dO<dM)s-=30*(1-prog);
  const gy=team==='A'?0:H;
  s+=Math.max(0,40-Math.hypot(ball.x-W/2,ball.y-gy)/5);
  const gk=bs.find(b=>b.team===team&&b.n===1);
  if(gk){const oy=team==='A'?H:0;s-=Math.min(20,Math.hypot(gk.x-W/2,gk.y-oy)/12)}

}
function simulate(idx,ang,pw,team,spin){
  const bs=S.bodies.map(b=>({...b}));
  const p=bs[idx],v=speedOf(pw);p.vx=Math.cos(ang)*v;p.vy=Math.sin(ang)*v;p.spin=spin||0;
  const bx0=bs[0].x,by0=bs[0].y;let goal=null;
  for(let t=0;t<500;t++){goal=step(bs);if(goal||stopped(bs))break}
  return evaluate(bs,goal,team,bx0,by0);
}
function cpuThink(team){
  const cfg=AI[S.diff],ball=S.bodies[0];
  let idxs=S.bodies.map((b,i)=>i).filter(i=>S.bodies[i].team===team);
  idxs.sort(()=>Math.random()-.5);idxs=idxs.slice(0,cfg.pieces);
  const gy=team==='A'?0:H;
  const gxs=[W/2,GX1+22,GX2-22,GX1+40,GX2-40].slice(0,cfg.ghost);
  let best={s:-Infinity,idx:idxs[0],ang:0,pw:.8};
  for(const i of idxs){
    const p=S.bodies[i],angs=[];
    for(const gx of gxs){
      const dx=gx-ball.x,dy=gy-ball.y,l=Math.hypot(dx,dy)||1;
      const cx=ball.x-dx/l*(R+BR),cy=ball.y-dy/l*(R+BR);
      angs.push(Math.atan2(cy-p.y,cx-p.x))}
    angs.push(Math.atan2(ball.y-p.y,ball.x-p.x));
    for(let k=0;k<cfg.rand;k++)angs.push(Math.random()*Math.PI*2);
    for(const a of angs)for(const pw of cfg.powers)for(const sn of cfg.spins){
      const s=simulate(i,a,pw,team,sn)+Math.random()*.5;
      if(s>best.s)best={s,idx:i,ang:a,pw,spin:sn}}
  }
  best.ang+=(Math.random()*2-1)*cfg.noise;
  best.pw=Math.min(1,Math.max(.2,best.pw*(1+(Math.random()*2-1)*cfg.noise)));
  return best;
}

function confetti(x,y,team){
  const cs=[COL[team],LIGHT[team],'#ffffff','#ffd43b'];
  const dir=y<H/2?1:-1;
  for(let i=0;i<110;i++){const a=Math.PI/2*dir+(Math.random()-.5)*2.4,sp=3+Math.random()*6;
    P.push({k:'conf',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:90+Math.random()*60,
      c:cs[i%4],w:4+Math.random()*4,h:3+Math.random()*3,rot:Math.random()*6,vr:(Math.random()-.5)*.4})}
}
function updParticles(){
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life++;
    if(p.k==='spark'){p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9}
    else if(p.k==='conf'){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.12;p.rot+=p.vr}

// ===== 描画：キャッシュ =====
const OL='#1c2b22';
const cv=$('cv'),ctx=cv.getContext('2d');
let scale=1,dpr=1,K=1,fieldCache=null,SPR={};
const CW=W+2*SM,CH=H+2*M;
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
// 縁取り付きの線（下に太い黒、上に色）
function inkStroke(c,col,w){c.strokeStyle=OL;c.lineWidth=w+3;c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke()}
// セル塗り（影色の円の上に、左上へずらしたベース色の円を重ねて三日月の影を作る）
function celDisc(c,r,base,shade,off){
  c.save();c.beginPath();c.arc(0,0,r,0,7);c.clip();
  c.fillStyle=shade;c.fillRect(-r,-r,2*r,2*r);
  c.fillStyle=base;c.beginPath();c.arc(-off,-off,r,0,7);c.fill();c.restore();
}

function buildField(){
  fieldCache=mkCanvas(CW*K,CH*K);const c=fieldCache.getContext('2d');
  c.setTransform(K,0,0,K,SM*K,M*K);c.lineJoin='round';c.lineCap='round';
  // 木の盤（イラスト調）
  c.fillStyle='rgba(0,0,0,.25)';rrect(c,-10,-6,W+26,H+24,20);c.fill();
  rrect(c,-13,-13,W+26,H+26,20);c.fillStyle='#d39b5f';c.fill();
  if(IMG.wood){// 木目が縁に沿うよう、上下は横向き・左右は縦向きに貼る
    const k=110/IMG.wood.width;c.save();rrect(c,-13,-13,W+26,H+26,20);c.clip();
    const ph=c.createPattern(IMG.wood,'repeat');ph.setTransform(new DOMMatrix().translate(0,-10).scale(k));
    const pv=c.createPattern(IMG.wood,'repeat');pv.setTransform(new DOMMatrix().translate(-10,0).rotate(90).scale(k));
    c.fillStyle=pv;c.fillRect(-13,-13,13,H+26);c.fillRect(W,-13,13,H+26);
    c.fillStyle=ph;c.fillRect(0,-13,W,13);ph.setTransform(new DOMMatrix().translate(0,H-3).scale(k));c.fillRect(0,H,W,13);
    c.restore();rrect(c,-13,-13,W+26,H+26,20)}
  else{c.save();rrect(c,-13,-13,W+26,H+26,20);c.clip();
    const rnd0=rng(3);c.strokeStyle='#e6b47c';c.lineWidth=1.6;
    for(let i=0;i<40;i++){const y=-13+rnd0()*(H+26),x=-13+rnd0()*(W+10);c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+12,y-2,x+26+rnd0()*20,y);c.stroke()}
    c.restore()}
  c.strokeStyle=OL;c.lineWidth=3;c.stroke();
  rrect(c,-4,-4,W+8,H+8,10);c.fillStyle='#a86b35';c.fill();c.strokeStyle=OL;c.lineWidth=2.5;c.stroke();
  for(const [x,y] of [[-8,-8],[W+8,-8],[-8,H+8],[W+8,H+8],[-8,H/2],[W+8,H/2]]){
    c.fillStyle='#ffe08a';c.beginPath();c.arc(x,y,3,0,7);c.fill();c.strokeStyle=OL;c.lineWidth=1.5;c.stroke()}
  // 芝
  c.save();rrect(c,0,0,W,H,6);c.clip();
  if(IMG.grass){c.drawImage(IMG.grass,0,0,W,H)}
  else{
    for(let i=0;i<10;i++){c.fillStyle=i%2?'#5cbf5a':'#51b250';c.fillRect(0,i*H/10,W,H/10)}
    const rnd=rng(7);
    c.strokeStyle='#3f9a43';c.lineWidth=1.4;
    for(let i=0;i<150;i++){const x=rnd()*W,y=rnd()*H;c.beginPath();c.moveTo(x-3,y-3);c.lineTo(x-1,y+1);c.lineTo(x+1,y-4);c.lineTo(x+3,y+1);c.lineTo(x+5,y-3);c.stroke()}
    for(let i=0;i<26;i++){const x=rnd()*W,y=rnd()*H;c.fillStyle=rnd()<.5?'#fff6c2':'#ffffff';
      for(let k=0;k<4;k++){c.beginPath();c.arc(x+Math.cos(k*1.57)*1.8,y+Math.sin(k*1.57)*1.8,1.3,0,7);c.fill()}
      c.fillStyle='#ffd43b';c.beginPath();c.arc(x,y,1,0,7);c.fill()}
  }
  // ライン
  c.strokeStyle='#ffffff';c.lineWidth=3;
  c.strokeRect(6,6,W-12,H-12);
  c.beginPath();c.moveTo(6,H/2);c.lineTo(W-6,H/2);c.stroke();
  c.beginPath();c.arc(W/2,H/2,CENTER_R,0,7);c.stroke();
  for(const top of [true,false]){
    const y0=top?6:H-6,s=top?1:-1;
    c.beginPath();c.moveTo((W-210)/2,y0);c.lineTo((W-210)/2,y0+s*88);c.lineTo((W+210)/2,y0+s*88);c.lineTo((W+210)/2,y0);c.stroke();
    c.beginPath();c.moveTo((W-150)/2,y0);c.lineTo((W-150)/2,y0+s*34);c.lineTo((W+150)/2,y0+s*34);c.lineTo((W+150)/2,y0);c.stroke();
    c.beginPath();top?c.arc(W/2,y0+88,30,.18*Math.PI,.82*Math.PI):c.arc(W/2,y0-88,30,1.18*Math.PI,1.82*Math.PI);c.stroke();
    c.fillStyle='#fff';c.beginPath();c.arc(W/2,y0+s*62,2.6,0,7);c.fill();
  }
  for(const [x,y,a] of [[6,6,0],[W-6,6,.5],[W-6,H-6,1],[6,H-6,1.5]]){c.beginPath();c.arc(x,y,10,a*Math.PI,(a+.5)*Math.PI);c.stroke()}
  c.fillStyle='#fff';c.beginPath();c.arc(W/2,H/2,3.2,0,7);c.fill();
  c.restore();
  // ゴール
  for(const top of [true,false]){
    const gy=top?-GD:H;
    c.fillStyle='#2c5a3a';c.fillRect(GX1,gy,GW,GD);
    c.save();c.beginPath();c.rect(GX1,gy,GW,GD);c.clip();
    if(IMG.net){const pt=c.createPattern(IMG.net,'repeat');pt.setTransform(new DOMMatrix().translate(GX1,gy).scale(56/IMG.net.width));c.fillStyle=pt;c.fillRect(GX1,gy,GW,GD)}
    else{c.strokeStyle='rgba(255,248,231,.7)';c.lineWidth=1.2;c.beginPath();
      for(let x=GX1;x<=GX2;x+=9){c.moveTo(x,gy);c.lineTo(x,gy+GD)}
      for(let y=gy;y<=gy+GD;y+=7){c.moveTo(GX1,y);c.lineTo(GX2,y)}

    const dg=c.createLinearGradient(0,top?-GD:H+GD,0,top?0:H);dg.addColorStop(0,'rgba(10,30,18,.45)');dg.addColorStop(1,'rgba(10,30,18,0)');
    c.fillStyle=dg;c.fillRect(GX1,gy,GW,GD);
    c.restore();
    c.beginPath();
    if(top){c.moveTo(GX1,0);c.lineTo(GX1,-GD);c.lineTo(GX2,-GD);c.lineTo(GX2,0)}
    else{c.moveTo(GX1,H);c.lineTo(GX1,H+GD);c.lineTo(GX2,H+GD);c.lineTo(GX2,H)}
    inkStroke(c,'#ffffff',4);
    for(const x of [GX1,GX2]){const y=top?0:H;c.fillStyle='#fff';c.beginPath();c.arc(x,y,POST+.8,0,7);c.fill();c.strokeStyle=OL;c.lineWidth=2;c.stroke()}
  }
}
function buildSprites(){
  const S2=(R+3)*2;
  const make=(team,gk)=>{const cnv=mkCanvas(S2*K,S2*K),c=cnv.getContext('2d');
    c.setTransform(K,0,0,K,(R+3)*K,(R+3)*K);
    const img=IMG[(gk?'gk':'piece')+team];
    if(img){c.save();c.beginPath();c.arc(0,0,R,0,7);c.clip();c.drawImage(img,-R,-R,2*R,2*R);c.restore();
      c.strokeStyle=OL;c.lineWidth=2.5;c.beginPath();c.arc(0,0,R-1,0,7);c.stroke();return cnv}
    // 外リング
    c.fillStyle=OL;c.beginPath();c.arc(0,0,R,0,7);c.fill();
    celDisc(c,R-2.5,gk?'#ffd43b':'#ffffff',gk?'#e0a800':'#c9d3de',2.4);
    // 内ディスク
    const ir=R*.7;
    c.fillStyle=OL;c.beginPath();c.arc(0,0,ir+1.5,0,7);c.fill();
    celDisc(c,ir,COL[team],SHADE[team],2);
    // ハイライト（くっきり）
    c.fillStyle='rgba(255,255,255,.95)';c.beginPath();c.ellipse(-ir*.38,-ir*.42,ir*.32,ir*.17,-.7,0,7);c.fill();
    c.beginPath();c.arc(-ir*.02,-ir*.62,1.3,0,7);c.fill();
    c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.ellipse(-R*.55,-R*.55,2.6,1.4,-.8,0,7);c.fill();
    return cnv};
  SPR={A:make('A',false),B:make('B',false),GA:make('A',true),GB:make('B',true)};
}
function resize(){
  const st=$('stage');const aw=st.clientWidth-6,ah=st.clientHeight-6;
  scale=Math.max(.3,Math.min(aw/CW,ah/CH));dpr=Math.min(3,window.devicePixelRatio||1);K=scale*dpr;
  cv.style.width=CW*scale+'px';cv.style.height=CH*scale+'px';
  cv.width=Math.round(CW*K);cv.height=Math.round(CH*K);
  buildField();buildSprites();
}
window.addEventListener('resize',resize);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>resize());

// ===== 描画：毎フレーム =====
function pent(c,x,y,r,rot){c.beginPath();for(let k=0;k<5;k++){const a=rot+k*1.2566;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath();c.fill()}
function drawShadow(b,r){const f=S.flip?-1:1;ctx.fillStyle='rgba(20,40,25,.28)';ctx.beginPath();ctx.ellipse(b.x+3*f,b.y+4*f,r,r*.92,0,0,7);ctx.fill()}
function outlinedText(txt,x,y,font,fill,lw){
  ctx.save();ctx.translate(x,y);if(S.flip)ctx.rotate(Math.PI);   // 反転表示でも文字は正立
  ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.strokeStyle=OL;ctx.lineWidth=lw;ctx.strokeText(txt,0,0);ctx.fillStyle=fill;ctx.fillText(txt,0,0);ctx.restore();
}
function drawPiece(b,dim,glow,sel,t){
  ctx.globalAlpha=dim?.4:1;
  const sc=sel?1.1:1,half=(R+3)*sc;
  if(glow){ctx.save();ctx.setLineDash([7,5]);ctx.lineDashOffset=-t/40;ctx.lineWidth=5;ctx.strokeStyle=OL;
    ctx.beginPath();ctx.arc(b.x,b.y,R+6,0,7);ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle=LIGHT[b.team];ctx.stroke();ctx.restore()}
  ctx.save();ctx.translate(b.x,b.y);if(S.flip)ctx.rotate(Math.PI);ctx.drawImage(SPR[(b.n===1?'G':'')+b.team],-half,-half,half*2,half*2);ctx.restore();
  if(sel){ctx.beginPath();ctx.arc(b.x,b.y,R*sc+4,0,7);ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle='#ffd43b';ctx.stroke()}
  outlinedText(b.n===1?'GK':String(b.n),b.x,b.y+1,(b.n===1?'10px':'13px')+' "Dela Gothic One"','#fff',3);
  ctx.globalAlpha=1;
}
function drawBall(b){
  drawShadow(b,BR+1);
  ctx.save();ctx.translate(b.x,b.y);
  if(S.flip)ctx.rotate(Math.PI);
  if(IMG.ball){ctx.rotate(b.rot||0);ctx.beginPath();ctx.arc(0,0,BR,0,7);ctx.clip();ctx.drawImage(IMG.ball,-BR,-BR,2*BR,2*BR);ctx.restore();
    ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,BR,0,7);ctx.stroke();return}
  ctx.fillStyle=OL;ctx.beginPath();ctx.arc(0,0,BR+1.5,0,7);ctx.fill();
  celDisc(ctx,BR,'#ffffff','#cfd6df',1.8);
  ctx.beginPath();ctx.arc(0,0,BR,0,7);ctx.clip();
  ctx.rotate(b.rot||0);ctx.fillStyle=OL;
  pent(ctx,0,0,4,-Math.PI/2);
  for(let k=0;k<5;k++){const a=-Math.PI/2+k*1.2566+.628;pent(ctx,Math.cos(a)*BR*1.02,Math.sin(a)*BR*1.02,3.8,a)}
  ctx.restore();
  const f=S.flip?-1:1;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(b.x-4*f,b.y-4.5*f,2.6,1.5,-.7,0,7);ctx.fill();
}
function powColor(pw){return pw<.4?'#5cd15a':pw<.75?'#ffd43b':'#ff5a5a'}
// 予測線：打った駒だけを（衝突なしで）少し先まで動かして、スピンの曲がりを見せる
function previewPath(p,ang,pw,spin,n){
  const v=speedOf(Math.max(pw,.05)),b={vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,spin};
  let x=p.x,y=p.y,acc=0,pts=[];const need=R+20;
  for(let t=0;t<400&&pts.length<n;t++){
    const sp=Math.hypot(b.vx,b.vy);if(sp<STOP)break;
    x+=b.vx;y+=b.vy;acc+=sp;
    if(acc>=(pts.length?13:need)){acc=0;pts.push([x,y,Math.atan2(b.vy,b.vx)])}
    b.vx*=FR_P;b.vy*=FR_P;curve(b);
  }
  return pts;
}
function drawAim(p,ang,pw,anchor,pt,spin){
  const c=powColor(pw);spin=spin||0;
  ctx.lineCap='round';ctx.lineJoin='round';
  if(anchor&&pt){ // 引っ張り始めた点→指の位置（ゴムひも）
    ctx.beginPath();ctx.moveTo(anchor.x,anchor.y);ctx.lineTo(pt.x,pt.y);
    ctx.strokeStyle=OL;ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle='#fff8e7';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='rgba(255,248,231,.5)';ctx.beginPath();ctx.arc(anchor.x,anchor.y,7,0,7);ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff8e7';ctx.beginPath();ctx.arc(pt.x,pt.y,6,0,7);ctx.fill();ctx.stroke()}
  // パワーリング
  ctx.strokeStyle=OL;ctx.lineWidth=8;ctx.beginPath();ctx.arc(p.x,p.y,R+10,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(255,248,231,.85)';ctx.lineWidth=4;ctx.stroke();
  ctx.strokeStyle=c;ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,R+10,-Math.PI/2,-Math.PI/2+pw*Math.PI*2);ctx.stroke();
  // 予測ドット（スピンがあると曲がって見える）
  const n=3+Math.round(pw*9),pts=previewPath(p,ang,pw,spin,n+1);
  pts.slice(0,-1).forEach(([x,y],i)=>{const r=3.6-2*i/n;
    ctx.fillStyle=spin?'#ffe9a8':'#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=1.8;ctx.stroke()});
  // 矢じり
  if(pts.length){const [ex,ey,a2]=pts[pts.length-1],ca=Math.cos(a2),sa=Math.sin(a2);
    ctx.beginPath();ctx.moveTo(ex+ca*11,ey+sa*11);ctx.lineTo(ex+Math.cos(a2+2.5)*11,ey+Math.sin(a2+2.5)*11);
    ctx.lineTo(ex+ca*2,ey+sa*2);ctx.lineTo(ex+Math.cos(a2-2.5)*11,ey+Math.sin(a2-2.5)*11);ctx.closePath();
    ctx.fillStyle=c;ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=2.5;ctx.stroke()}
  outlinedText(Math.round(pw*100)+'%',p.x,p.y+(S.flip?R+22:-R-22),'12px "Dela Gothic One"',c,4);
}
function drawStar(p){const a=1-p.life/p.max,e=Math.min(1,p.life/4),r=p.r*e;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,a*1.6);ctx.beginPath();
  for(let k=0;k<16;k++){const rr=k%2?r*.45:r;const an=k*Math.PI/8;ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}
  ctx.closePath();ctx.fillStyle='#ffd43b';ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
function draw(t){
  const sx=S.shake?(Math.random()-.5)*S.shake*K:0,sy=S.shake?(Math.random()-.5)*S.shake*K:0;

  if(S.flip){ // 赤チーム側から見るため180°回転
    ctx.setTransform(-1,0,0,-1,CW*K,CH*K);if(fieldCache)ctx.drawImage(fieldCache,sx,sy);

    if(e>1)S.ripple=null;else{const gy=S.ripple.top?-GD:H;ctx.save();ctx.beginPath();ctx.rect(GX1,gy,GW,GD);ctx.clip();
      for(let k=0;k<3;k++){const ee=e-k*.15;if(ee<=0)continue;
        ctx.strokeStyle=`rgba(255,212,59,${1-ee})`;ctx.lineWidth=3;ctx.beginPath();
        ctx.arc(S.ripple.x,S.ripple.top?-GD/2:H+GD/2,ee*70,0,7);ctx.stroke()}

  if(S.screen==='form'){

    ctx.fillRect(6,top?6:H/2,W-12,H/2-6);

    ctx.globalAlpha=.22;outlinedText(nm,W/2,top?H*.25:H*.75,(nm.length>5?'38px':'56px')+' "Dela Gothic One"','#fff',6);ctx.globalAlpha=1;
  }
  // ボールの軌跡（漫画風の白い尾）
  if(S.trail.length>1){ctx.lineCap='round';for(let i=1;i<S.trail.length;i++){const a=i/S.trail.length;

    ctx.beginPath();ctx.moveTo(S.trail[i-1].x,S.trail[i-1].y);ctx.lineTo(S.trail[i].x,S.trail[i].y);ctx.stroke()}}
  const bs=S.bodies;
  for(let i=1;i<bs.length;i++){if(!(S.screen==='form'&&bs[i].team!==S.editTeam))drawShadow(bs[i],R+1)}
  for(let i=1;i<bs.length;i++){const b=bs[i];
    const dim=S.screen==='form'&&b.team!==S.editTeam;
    const sel=(S.aim&&S.aim.idx===i)||(S.drag&&S.drag.idx===i)||(S.cpuAim&&S.cpuAim.idx===i)||(S.phase==='aim'&&S.sel===i);
    const glow=S.screen==='play'&&S.phase==='aim'&&b.team===S.turn&&!isCPU(S.turn)&&!sel;

  }

}

let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=1000/60){acc-=1000/60;
    if(S.paused)continue;
    updParticles();
    if(S.screen==='play'&&S.phase==='moving'){
      const g=step(S.bodies,hitFx);S.steps++;
      const ball=S.bodies[0],sp=Math.hypot(ball.vx,ball.vy);
      ball.rot+=(ball.vx>=0?1:-1)*sp/BR*.5;
      if(sp>2.2){S.trail.push({x:ball.x,y:ball.y});if(S.trail.length>14)S.trail.shift()}
      else if(S.trail.length)S.trail.shift();
      for(const b of S.bodies){if(b._w>1.2)SE.wall(b._w);if(b._p>1)SE.post(b._p);b._w=0;b._p=0}
      if(g)onGoal(g);
      else if(stopped(S.bodies)||S.steps>900){
        if(S.steps>900)S.bodies.forEach(b=>{b.vx=0;b.vy=0});
        S.trail=[];S.turn=S.turn==='A'?'B':'A';beginTurn()}
    }else if(S.trail.length)S.trail.shift();
  }
  draw(t);requestAnimationFrame(loop);
}

// ===== オンライン対戦（claude.ai の room 機能）=====
// 同期方式：各プレイヤーは自分の presence に「試合開始情報 start」と「最新ショット last」を載せる。
// last には打つ直前の全駒座標と速度ベクトルを含め、受信側は同じ状態から同じ物理計算をするので結果が一致する。
const O={nr:null,code:'',role:null,myTeam:null,ready:false,epoch:0,n:0,last:null,forms:null,unsub:[],opp:null,myPeer:null,conn:false};
// 通信の方式は2つ：claude.ai 上では room 機能、それ以外（GitHub Pages など）では PeerJS による P2P 接続。
let ROOM=null,ROOM_STATE='wait',NET='claude';
try{if(window.claude&&claude.use)claude.use('room').then(r=>{if(r){ROOM=r;ROOM_STATE='ok'}else usePeer()}).catch(usePeer);else usePeer()}catch(e){usePeer()}
function usePeer(){
  NET='p2p';
  const ready=()=>{ROOM={join:(name,role)=>peerJoin(name,role)};ROOM_STATE='ok'};
  if(window.Peer)return ready();
  const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/peerjs@1/dist/peerjs.min.js';
  sc.onload=()=>window.Peer?ready():(ROOM_STATE='na');sc.onerror=()=>{ROOM_STATE='na'};document.head.appendChild(sc);
}
// PeerJS を room 機能と同じ形（presence / peers / onPeers / onConnection / leave）に包む。ホストが部屋IDを持ち、ゲストが接続する1対1。
function peerJoin(name,role){
  return new Promise((resolve,reject)=>{
    const hostId='soccerpool5-'+name;
    const mine={},others={},conns={};let L=[],C=[],conn=false,done=false,peer;
    const peers=()=>[{peer:peer&&peer.id||'me',presence:mine,isMe:true,sameTab:true,kind:'viewer',guest:false,by:null,updatedAt:Date.now()},
      ...Object.keys(others).map(k=>({peer:k,presence:others[k],isMe:false,sameTab:false,kind:'viewer',guest:false,by:null,updatedAt:Date.now()}))];
    const fire=()=>setTimeout(()=>L.forEach(f=>{try{f({peers:peers(),joined:[],left:[],updated:[]})}catch(e){}}),0);
    const setConn=v=>{conn=v;C.forEach(f=>{try{f(v)}catch(e){}})};
    const send=(c,m)=>{try{if(c.open)c.send(m)}catch(e){}};
    const wire=c=>{
      c.on('open',()=>{conns[c.peer]=c;send(c,{t:'pres',p:mine});if(role!=='host')setConn(true);ok()});
      c.on('data',d=>{if(!d||typeof d!=='object')return;
        if(d.t==='pres'&&d.p&&typeof d.p==='object'){others[c.peer]=d.p;fire()}
        else if(d.t==='full'){fail('full')}});
      c.on('close',()=>{delete conns[c.peer];delete others[c.peer];fire();if(role!=='host'){setConn(false);setTimeout(reconnect,1500)}});
      c.on('error',()=>{});
    };
    const reconnect=()=>{if(!peer||peer.destroyed||Object.keys(conns).length)return;try{wire(peer.connect(hostId,{reliable:true}))}catch(e){}};
    const api={name,emit:async()=>{},on:()=>()=>{},
      presence:async patch=>{for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=JSON.parse(JSON.stringify(patch[k]))}
        Object.values(conns).forEach(c=>send(c,{t:'pres',p:mine}));fire()},
      peers,onPeers:f=>{L.push(f);fire();return()=>{L=L.filter(x=>x!==f)}},
      connected:()=>conn,onConnection:f=>{C.push(f);setTimeout(()=>f(conn),0);return()=>{C=C.filter(x=>x!==f)}},
      leave:async()=>{try{peer.destroy()}catch(e){}}};
    const ok=()=>{if(!done){done=true;resolve(api)}};
    const fail=code=>{if(!done){done=true;try{peer.destroy()}catch(e){}reject({code})}};
    let tries=0;
    const start=()=>{
      peer=role==='host'?new Peer(hostId):new Peer();
      peer.on('open',()=>{if(role==='host'){setConn(true);ok()}else wire(peer.connect(hostId,{reliable:true}))});
      peer.on('connection',c=>{
        if(role!=='host')return c.close();
        const busy=Object.keys(conns).filter(k=>k!==c.peer).length>0;
        if(busy){c.on('open',()=>{send(c,{t:'full'});setTimeout(()=>c.close(),300)});return}
        wire(c)});
      peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
      peer.on('error',e=>{const t=e&&e.type;
        if(t==='unavailable-id'&&role==='host'&&tries++<5){try{peer.destroy()}catch(_){}setTimeout(start,2000)} // 再接続直後は古いIDが残っていることがある
        else if(t==='peer-unavailable'){done?setTimeout(reconnect,2500):fail('notfound')}
        else if(!done)fail(t||'error')});
    };
    start();
    setTimeout(()=>fail('timeout'),20000);
  });
}

async function onlineJoin(code,role){
  code=(code||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(code.length<3)return onMsg('部屋コードを入力してください',true);
  if(!ROOM){
    if(ROOM_STATE==='wait'){onMsg('接続を準備中です。少し待ってからもう一度押してください');return}
    return onMsg('オンライン機能を読み込めませんでした（ネット接続を確認してください）',true)}
  onMsg('接続中…');
  const EM={notfound:'その部屋は見つかりませんでした。コードを確認してください',full:'その部屋は満員です',timeout:'接続がタイムアウトしました',
    'unavailable-id':'その部屋コードは使用中です。もう一度「部屋を作る」を押してください'};
  let nr;try{nr=await ROOM.join('sp5-'+code,role)}catch(e){const c=e&&e.code||'error';return onMsg(EM[c]||'接続できませんでした（'+c+'）',true)}
  O.nr=nr;O.code=code;O.role=role;O.myTeam=role==='guest'?'B':'A';O.ready=false;O.epoch=0;O.n=0;O.last=null;O.forms=null;O.opp=null;
  try{localStorage.setItem('soccerpool5.online',JSON.stringify({code,role,t:Date.now()}))}catch(e){}
  onlinePres({v:1,role,form:S.forms.A,ready:false,start:null,last:null});
  O.unsub.push(nr.onPeers(()=>onlineSync(),()=>{}));
  O.unsub.push(nr.onConnection(c=>{O.conn=c;updLobby()},()=>{}));
  S.mode='online';showLobby();
}

function onlineSync(){
  if(!O.nr)return;
  const me=O.nr.peers().find(p=>p.sameTab);if(me)O.myPeer=me.peer;
  const os=others();
  // ゲストが2人以上いたら、peer名の小さい方以外は観戦に回る（全員が同じ規則で判断）
  if(O.role==='guest'&&os.some(p=>p.presence.role==='guest'&&!p.isMe&&O.myPeer&&p.peer<O.myPeer)){O.role='spec';O.myTeam=null;onlinePres({role:'spec',ready:false});}
  const want=O.role==='host'?'guest':'host';
  O.opp=O.role==='spec'?(os.find(p=>p.presence.role==='host')||null):(os.find(p=>p.presence.role===want&&!p.isMe)||null);
  // 試合開始・最新ショットの同期
  let st=null,lt=null;
  for(const p of os){const pr=p.presence;
    if(pr.start&&(!st||pr.start.epoch>st.epoch))st=pr.start;
    if(pr.last&&(!lt||pr.last.epoch>lt.epoch||(pr.last.epoch===lt.epoch&&pr.last.n>lt.n)))lt=pr.last}
  if(st&&st.epoch>O.epoch)beginOnlineMatch(st,lt&&lt.epoch===st.epoch?lt:null);
  else if(lt&&lt.epoch===O.epoch&&lt.n>O.n&&S.screen==='play')applyRemoteShot(lt);
  // ホストは2人の準備がそろったら開始
  if(O.role==='host'&&S.screen==='lobby'&&O.ready&&O.opp&&O.opp.presence.ready&&Array.isArray(O.opp.presence.form))hostStart(false);
  if(S.screen==='play'&&O.role!=='spec'&&!O.opp)toast('相手の接続が切れました。再接続を待っています…');
  updLobby();
}
function validForm(f){return Array.isArray(f)&&f.length===5&&f.every(q=>Array.isArray(q)&&q.length===2&&q.every(Number.isFinite))}
function hostStart(rematch){
  const gf=rematch&&O.forms?O.forms.B:(O.opp&&O.opp.presence.form);
  if(!validForm(gf))return;
  const st={epoch:Date.now(),fa:rematch&&O.forms?O.forms.A:S.forms.A,fb:gf};
  O.ready=false;onlinePres({start:st,last:null,ready:false});
  beginOnlineMatch(st,null);
}
function beginOnlineMatch(st,lt){
  if(!validForm(st.fa)||!validForm(st.fb))return;
  O.epoch=st.epoch;O.n=0;O.last=null;O.forms={A:st.fa,B:st.fb};O.ready=false;
  onlinePres({start:st,ready:false});              // 再接続した人のために自分も開始情報を持つ
  show('online',false);show('result',false);show('pause',false);
  S.mode='online';S.flip=O.myTeam==='B';
  startMatch();
  if(lt)applyRemoteShot(lt);
}
function onlineSendShot(idx,vx,vy,spin){
  const L={epoch:O.epoch,n:O.n+1,team:S.turn,idx,vx,vy,spin,score:{A:S.score.A,B:S.score.B},
    state:S.bodies.map(b=>[b.x,b.y])};
  O.n=L.n;O.last=L;onlinePres({last:L});
}
function applyRemoteShot(L){
  if(L.epoch!==O.epoch||L.n<=O.n||!Array.isArray(L.state)||L.state.length!==11)return;
  if(!(L.team==='A'||L.team==='B')||!Number.isFinite(L.vx)||!Number.isFinite(L.vy)||!(L.idx>=1&&L.idx<=10))return;
  S.gen++;$('banner').classList.remove('show');show('result',false);
  O.n=L.n;O.last=L;onlinePres({last:L});           // 自分も最新ショットを持っておく
  S.score={A:L.score.A|0,B:L.score.B|0};updScore();
  S.bodies=makeBodies();L.state.forEach((q,i)=>{S.bodies[i].x=+q[0];S.bodies[i].y=+q[1];S.bodies[i].vx=0;S.bodies[i].vy=0;S.bodies[i].spin=0});
  S.turn=L.team;S.trail=[];S.aim=null;S.cpuAim=null;
  const sp=Number.isFinite(L.spin)?Math.max(-1,Math.min(1,L.spin)):0;
  launch(L.idx,Math.max(-MAX_SPEED,Math.min(MAX_SPEED,L.vx)),Math.max(-MAX_SPEED,Math.min(MAX_SPEED,L.vy)),sp);
}
let toastT=0;
function toast(t){const e=$('turnPop');if(Date.now()-toastT<4000)return;toastT=Date.now();
  e.style.setProperty('--tc','#1c2b22');e.textContent=t;e.style.fontSize='16px';
  e.classList.remove('show');void e.offsetWidth;e.classList.add('show');setTimeout(()=>e.style.fontSize='',1000)}
$('onCreate').onclick=()=>onlineJoin(newCode(),'host');
$('onJoin').onclick=()=>onlineJoin($('onCode').value,'guest');
$('onCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('onJoin').onclick()});
$('onBack').onclick=()=>{show('online',false);toMenu()};
$('onLeave').onclick=onlineLeave;
$('onForm').onclick=openForm;
$('onReady').onclick=()=>{O.ready=!O.ready;onlinePres({ready:O.ready,form:S.forms.A});updLobby();onlineSync()};
$('onCopy').onclick=()=>{try{navigator.clipboard.writeText(O.code).then(()=>{$('onCopy').textContent='コピー済み';setTimeout(()=>$('onCopy').textContent='コピー',1500)}).catch(()=>{})}catch(e){}};

document.addEventListener('pointerdown',()=>audio(),{passive:true});
document.addEventListener('click',e=>{if(e.target.closest('button')&&e.target.closest('button').id!=='sndBtn')SE.ui()});
$('sndBtn').onclick=()=>setSound(!SND.on);$('sndBtn').innerHTML=SND.on?SVG_ON:SVG_OFF;
loadForms();loadAssets();S.bodies=makeBodies();resize();updTurn();requestAnimationFrame(loop);
})();
